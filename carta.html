<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Interativa</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3e5d8;
            font-family: Arial, sans-serif;
        }

        .envelope {
            position: relative;
            width: 80%;
            max-width: 300px;
            height: 200px;
            background-color: #FF6347;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 50%;
            background-color: #FF7F50;
            transform-origin: top;
            transition: transform 0.5s;
        }

        .card {
            position: absolute;
            top: 100%;
            width: 100%;
            height: 100%;
            background-color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 16px;
            color: #333;
            transition: top 0.5s;
        }

        .open .flap {
            transform: rotateX(180deg);
        }

        .open .card {
            top: 0;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .card {
                font-size: 14px;
            }

            .envelope {
                width: 90%;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="envelope" onclick="toggleCard()">
        <div class="flap"></div>
        <div class="card">
            <p>Nois vai descer, vai desceer, descer la pra BC no finalzinho do anoo...</p>
        </div>
    </div>

    <script>
        function toggleCard() {
            document.querySelector('.envelope').classList.toggle('open');
        }
    </script>
</body>
</html>
